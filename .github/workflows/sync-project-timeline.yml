name: Sync project timeline

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/sync-project-timeline.yml
      - scripts/sync-project-timeline.mjs
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-timeline-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch GitHub milestones
        run: node scripts/sync-project-timeline.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit updated timeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/project-timeline.json
          if ! git diff --cached --quiet; then
            git commit -m "Update project timeline data"
            git push
          fi
